<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>台词助手</title>
  <style>
:root {
  --bg-a: #f6efe4;
  --bg-b: #d7efe6;
  --ink: #1e293b;
  --muted: #64748b;
  --panel: rgba(255, 255, 255, 0.88);
  --panel-strong: #ffffff;
  --line-border: rgba(15, 23, 42, 0.08);
  --accent: #0f766e;
  --accent-soft: #d9f4ef;
  --pill: #ffffff;
  --shadow-soft: 0 10px 28px rgba(15, 23, 42, 0.08);
  --shadow-tiny: 0 2px 8px rgba(15, 23, 42, 0.06);
  --toolbar-offset: 8px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 12% 12%, rgba(255, 255, 255, 0.8), transparent 36%),
    radial-gradient(circle at 88% 30%, rgba(255, 255, 255, 0.7), transparent 42%),
    linear-gradient(130deg, var(--bg-a), var(--bg-b));
}

body {
  padding: 20px 16px calc(14px + env(safe-area-inset-bottom));
}

.app {
  max-width: 860px;
  margin: 0 auto;
}

.top h1 {
  margin: 0;
  font-size: 32px;
  letter-spacing: 0.02em;
  color: #0f172a;
}

.top p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.back-to-load {
  display: none;
  margin-top: 12px;
}

.app.reading-mode .top,
.app.reading-mode .input-panel {
  display: none;
}

.app.reading-mode .back-to-load {
  display: inline-flex;
}

.app.reading-mode {
  height: calc(100vh - var(--toolbar-offset) - env(safe-area-inset-bottom));
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.app.reading-mode .reader {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  margin-bottom: 0;
}

.app.reading-mode .script-view {
  height: auto;
  flex: 1;
  min-height: 0;
  padding-bottom: 8px;
}

.input-panel {
  margin-top: 16px;
  background: var(--panel);
  border: 1px solid rgba(15, 23, 42, 0.08);
  border-radius: 18px;
  padding: 14px;
  backdrop-filter: blur(10px);
  box-shadow: var(--shadow-soft);
}

.input-panel label {
  font-size: 13px;
  font-weight: 600;
}

#scriptInput {
  width: 100%;
  min-height: 160px;
  margin-top: 10px;
  border-radius: 12px;
  border: 1px solid #cbd5e1;
  padding: 12px;
  font-size: 15px;
  line-height: 1.6;
  resize: vertical;
  background: rgba(255, 255, 255, 0.95);
  transition: border-color 160ms ease, box-shadow 160ms ease;
}

#scriptInput:focus {
  outline: none;
  border-color: #0b3a53;
  box-shadow: 0 0 0 3px rgba(11, 58, 83, 0.16);
}

#scriptInput::placeholder {
  color: #94a3b8;
}

.input-actions {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

#fileInput {
  display: none;
}

.role-settings {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.role-settings-panel {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 12px;
}

.role-settings-panel.hidden {
  display: none;
}

.role-card {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--panel-strong);
  border: 1px solid #d7e0eb;
  border-radius: 999px;
  padding: 6px 10px;
  font-size: 13px;
  box-shadow: var(--shadow-tiny);
}

.role-label {
  font-size: 12px;
  font-weight: 700;
}

.role-color {
  width: 28px;
  height: 28px;
  border-radius: 999px;
  border: 1px solid #cbd5e1;
  padding: 0;
  background: transparent;
  cursor: pointer;
}

button {
  border: 1px solid transparent;
  border-radius: 999px;
  padding: 9px 14px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 120ms ease, box-shadow 160ms ease, background 160ms ease, color 160ms ease;
}

button:hover {
  transform: translateY(-1px);
}

button:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.24);
}

.primary {
  background: var(--accent);
  color: #fff;
  border-color: #0d9488;
  box-shadow: 0 8px 16px rgba(15, 118, 110, 0.26);
}

.ghost {
  background: #ecfdf5;
  border-color: #bbf7d0;
  color: #065f46;
}

#sampleBtn.smart-active {
  background: #fef3c7;
  border-color: #fcd34d;
  color: #92400e;
  box-shadow: 0 6px 14px rgba(245, 158, 11, 0.18);
}

.reader {
  position: relative;
  margin-top: 14px;
  background: var(--panel);
  border-radius: 18px;
  border: 1px solid rgba(15, 23, 42, 0.08);
  backdrop-filter: blur(10px);
  box-shadow: var(--shadow-soft);
}

.exit-fullscreen-btn {
  display: none;
  position: absolute;
  top: calc(10px + env(safe-area-inset-top));
  right: 10px;
  z-index: 5;
  background: #111827;
  color: #ffffff;
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 12px;
}

.reader-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 12px;
  font-size: 13px;
}

.filter-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid #b8e8db;
  background: #f0fdfa;
  border-radius: 999px;
  padding: 7px 12px;
  cursor: pointer;
  user-select: none;
  box-shadow: var(--shadow-tiny);
}

.filter-title {
  font-weight: 800;
}

.filter-summary {
  color: var(--muted);
  max-width: min(48vw, 340px);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.filter-caret {
  font-size: 11px;
  color: #64748b;
}

.quick-play-btn {
  padding: 7px 14px;
  background: #d1fae5;
  border-color: #6ee7b7;
  color: #065f46;
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.18);
}

.quick-play-btn:hover {
  background: #a7f3d0;
  box-shadow: 0 8px 16px rgba(16, 185, 129, 0.24);
}

.role-filter-panel {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 0 12px 10px;
}

.role-filter-panel.hidden {
  display: none;
}

.role-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.filter-confirm {
  background: var(--accent);
  color: #ffffff;
  border-color: transparent;
  padding: 6px 12px;
  font-size: 12px;
}

.filter-chip {
  border: 1px solid #d8e2ed;
  border-radius: 999px;
  background: #f8fbfe;
  color: #334155;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 700;
}

.filter-chip.active {
  color: #ffffff;
  border-color: transparent;
  box-shadow: 0 6px 18px rgba(15, 23, 42, 0.2);
}

.script-view {
  --line-font-size: 17px;
  height: min(56vh, 560px);
  overflow-y: auto;
  padding: 6px 12px 12px;
  scroll-behavior: auto;
}

.line {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  margin: 0 0 10px;
  padding: 10px;
  border: 1px solid var(--line-border);
  border-left: 6px solid var(--speaker-color, #64748b);
  border-radius: 12px;
  background: #fff;
  line-height: 1.7;
  font-size: var(--line-font-size);
  box-shadow: var(--shadow-tiny);
  transition: transform 180ms ease, font-size 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}

.line[data-kind="hint"] {
  border-left-color: #94a3b8;
  color: #475569;
  background: #f8fafc;
}

.speaker {
  font-weight: 800;
  color: var(--speaker-color, #334155);
  white-space: nowrap;
  cursor: pointer;
}

.dialogue {
  flex: 1;
  word-break: break-word;
}

.line.zoomed {
  font-size: calc(var(--line-font-size) * 1.58);
  transform: scale(1.015);
  box-shadow: 0 10px 28px rgba(15, 23, 42, 0.2);
}

.toolbar-panel {
  margin: 0;
  padding: 8px 12px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  align-items: center;
  background: linear-gradient(135deg, #eef7fb, #f4faf5);
  border: 1px solid #d6e3ec;
  border-radius: 12px;
  margin: 0 12px 10px;
}

.toolbar-panel.hidden {
  display: none;
}

.toolbar-confirm {
  background: #ccfbf1;
  border-color: #99f6e4;
  color: #115e59;
}

.control {
  background: #f0fdfa;
  border-color: #b8e8db;
  color: #134e4a;
  padding: 10px 0;
  box-shadow: var(--shadow-tiny);
}

.speed-box,
.font-box,
.loop-box {
  text-align: left;
  font-size: 12px;
  line-height: 1.2;
  background: #ffffff;
  border: 1px solid #d7e0eb;
  color: #111827;
  border-radius: 12px;
  padding: 8px 10px;
  box-shadow: var(--shadow-tiny);
}

.speed-box strong,
.font-box strong {
  display: inline;
  font-size: 16px;
  margin-left: 4px;
}

.loop-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.loop-label {
  font-weight: 700;
  color: #0f172a;
}

#loopToggle {
  width: 18px;
  height: 18px;
  accent-color: #0f766e;
}

.range-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 6px;
}

.range-input {
  width: 100%;
  accent-color: #0f766e;
}

.full-btn {
  background: linear-gradient(135deg, #a7f3d0, #6ee7b7);
  border-color: #34d399;
  color: #064e3b;
}

.page-fullscreen-btn {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top));
  right: 12px;
  z-index: 1400;
  min-width: 96px;
  box-shadow: 0 10px 22px rgba(15, 23, 42, 0.2);
}

.reader.reader-fullscreen {
  position: fixed;
  inset: 0;
  z-index: 999;
  margin: 0;
  border-radius: 0;
  background: rgba(255, 255, 255, 0.98);
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding-top: env(safe-area-inset-top);
}

.reader.reader-fullscreen .script-view {
  height: auto;
  flex: 1;
  min-height: 0;
  padding-bottom: calc(96px + env(safe-area-inset-bottom));
}

.reader.reader-fullscreen .exit-fullscreen-btn {
  display: inline-flex;
  align-items: center;
}

@media (max-width: 700px) {
  .filter-summary {
    max-width: 42vw;
  }

  .toolbar-panel {
    grid-template-columns: 1fr;
  }

  .page-fullscreen-btn {
    top: calc(8px + env(safe-area-inset-top));
    right: 8px;
    min-width: 88px;
    padding: 8px 12px;
    font-size: 13px;
  }
}

@media (min-width: 900px) {
  body {
    padding-top: 28px;
  }
}
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>台词助手</h1>
      <p>粘贴剧本后自动识别角色，颜色区分台词，支持自动循环滚动。</p>
    </header>

    <button id="backToLoadBtn" class="ghost back-to-load" type="button">返回加载</button>

    <section class="input-panel">
      <label for="scriptInput">输入剧本（格式示例：张三：今天我们排练第2场）</label>
      <textarea id="scriptInput" placeholder="把剧本文本直接粘贴或输入到这里。&#10;示例：&#10;旁白：舞台灯光渐亮，排练开始。&#10;小林：今天我们先把第三场走一遍。"></textarea>
      <div class="input-actions">
        <button id="loadBtn" class="primary">加载剧本</button>
        <button id="sampleBtn" class="ghost">智能解析角色</button>
        <button id="importBtn" class="ghost" type="button">导入文件</button>
        <input id="fileInput" type="file" accept=".txt,.md,.csv,.json,text/plain" />
      </div>
    </section>

    <section class="reader" aria-label="台词阅读区">
      <button id="exitFullscreenBtn" class="exit-fullscreen-btn" type="button">退出全屏</button>
      <div class="reader-meta">
        <button id="roleSettingsToggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="roleSettingsPanel">
          <span class="filter-title">角色颜色</span>
          <span id="roleSettingsSummary" class="filter-summary">收起</span>
          <span class="filter-caret">▼</span>
        </button>
        <button id="filterToggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="roleFilterPanel">
          <span class="filter-title">当前显示</span>
          <span id="filterSummary" class="filter-summary">全部角色</span>
          <span class="filter-caret">▼</span>
        </button>
        <button id="toolbarToggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="toolbarPanel">
          <span class="filter-title">滚动控制</span>
          <span id="toolbarSummary" class="filter-summary">收起</span>
          <span class="filter-caret">▼</span>
        </button>
        <button id="playPauseBtn" class="quick-play-btn" type="button">开始滚动</button>
      </div>
      <div id="roleFilterPanel" class="role-filter-panel hidden">
        <div id="roleFilterBar" class="role-filter-bar" aria-label="角色筛选"></div>
        <button id="filterConfirmBtn" class="filter-confirm" type="button">确认</button>
      </div>
      <div id="roleSettingsPanel" class="role-settings-panel hidden">
        <div id="roleSettings" class="role-settings" aria-label="角色颜色设置区"></div>
        <button id="roleSettingsConfirmBtn" class="filter-confirm" type="button">确认</button>
      </div>
      <div id="toolbarPanel" class="toolbar-panel hidden">
        <div class="speed-box">
          <span>速度<strong id="speedValue">100</strong> px/s</span>
          <div class="range-row">
            <input id="speedRange" class="range-input" type="range" min="0" max="500" step="1" value="100" aria-label="速度滑杆" />
          </div>
        </div>
        <div class="font-box">
          <span>字体
          <strong id="fontSizeValue">17</strong>
          <span>px</span>
          </span>
          <div class="range-row">
            <input id="fontSizeRange" class="range-input" type="range" min="12" max="44" step="1" value="17" aria-label="字体滑杆" />
          </div>
        </div>
        <div class="loop-box">
          <label class="loop-label" for="loopToggle">循环滚动</label>
          <input id="loopToggle" type="checkbox" aria-label="循环滚动开关" />
        </div>
        <button id="toolbarConfirmBtn" class="control toolbar-confirm" type="button">确认</button>
      </div>
      <div id="scriptView" class="script-view"></div>
    </section>
  </main>

  <button id="fullscreenBtn" class="control full-btn page-fullscreen-btn" type="button">全屏阅读</button>

  <script>
const scriptInput = document.getElementById("scriptInput");
const loadBtn = document.getElementById("loadBtn");
const sampleBtn = document.getElementById("sampleBtn");
const importBtn = document.getElementById("importBtn");
const fileInput = document.getElementById("fileInput");
const app = document.querySelector(".app");
const backToLoadBtn = document.getElementById("backToLoadBtn");
const roleSettings = document.getElementById("roleSettings");
const roleSettingsToggle = document.getElementById("roleSettingsToggle");
const roleSettingsSummary = document.getElementById("roleSettingsSummary");
const roleSettingsPanel = document.getElementById("roleSettingsPanel");
const roleSettingsConfirmBtn = document.getElementById("roleSettingsConfirmBtn");
const scriptView = document.getElementById("scriptView");
const roleFilterBar = document.getElementById("roleFilterBar");
const roleFilterPanel = document.getElementById("roleFilterPanel");
const filterToggle = document.getElementById("filterToggle");
const filterSummary = document.getElementById("filterSummary");
const filterConfirmBtn = document.getElementById("filterConfirmBtn");
const toolbarToggle = document.getElementById("toolbarToggle");
const toolbarSummary = document.getElementById("toolbarSummary");
const toolbarPanel = document.getElementById("toolbarPanel");
const toolbarConfirmBtn = document.getElementById("toolbarConfirmBtn");
const playPauseBtn = document.getElementById("playPauseBtn");
const speedValue = document.getElementById("speedValue");
const speedRange = document.getElementById("speedRange");
const fontSizeValue = document.getElementById("fontSizeValue");
const fontSizeRange = document.getElementById("fontSizeRange");
const loopToggle = document.getElementById("loopToggle");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const exitFullscreenBtn = document.getElementById("exitFullscreenBtn");
const reader = document.querySelector(".reader");

const SPEED_MIN = 0;
const SPEED_MAX = 500;
const FONT_SIZE_MIN = 12;
const FONT_SIZE_MAX = 44;

let speed = 100;
let fontSize = 17;
let isPlaying = false;
let isLooping = false;
let isSmartParseEnabled = false;
let rafId = null;
let lastTs = 0;
let zoomedLine = null;
let parsedScript = [];
const activeSpeakerFilters = new Set();
const speakerColors = new Map();
let isFallbackFullscreen = false;

const demoText = [
  "旁白：舞台灯光渐亮，排练开始。",
  "小林：今天我们先把第三场走一遍。",
  "导演：注意情绪递进，第二句停顿半秒。",
  "小林：明白，我再试一次。",
  "阿青：我这句接在你停顿后。",
  "导演：很好，这次节奏就对了。"
].join("\n");

sampleBtn.addEventListener("click", () => {
  isSmartParseEnabled = !isSmartParseEnabled;
  sampleBtn.textContent = isSmartParseEnabled ? "取消智能解析" : "智能解析角色";
  sampleBtn.classList.toggle("smart-active", isSmartParseEnabled);
  renderScript(getRenderText(scriptInput.value));
});

importBtn.addEventListener("click", () => {
  fileInput.click();
});

fileInput.addEventListener("change", async () => {
  const [file] = fileInput.files || [];
  if (!file) {
    return;
  }

  try {
    let text = "";
    if (typeof file.text === "function") {
      text = await file.text();
    } else {
      text = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = () => reject(new Error("读取文件失败"));
        reader.readAsText(file, "utf-8");
      });
    }

    scriptInput.value = text;
    renderScript(getRenderText(text));
  } catch {
    alert("文件读取失败，请选择 UTF-8 文本文件。");
  } finally {
    fileInput.value = "";
  }
});

loadBtn.addEventListener("click", () => {
  renderScript(getRenderText(scriptInput.value));
  enterReadingMode();
});

backToLoadBtn.addEventListener("click", async () => {
  await exitFullscreenView();
  leaveReadingMode();
});

roleSettingsToggle.addEventListener("click", () => {
  setRoleSettingsPanelOpen(roleSettingsPanel.classList.contains("hidden"));
});

roleSettingsConfirmBtn.addEventListener("click", () => {
  setRoleSettingsPanelOpen(false);
});

filterToggle.addEventListener("click", () => {
  setFilterPanelOpen(roleFilterPanel.classList.contains("hidden"));
});

filterConfirmBtn.addEventListener("click", () => {
  setFilterPanelOpen(false);
});

toolbarToggle.addEventListener("click", () => {
  setToolbarPanelOpen(toolbarPanel.classList.contains("hidden"));
});

toolbarConfirmBtn.addEventListener("click", () => {
  setToolbarPanelOpen(false);
});

window.addEventListener("resize", () => {
  syncToolbarOffset();
});

playPauseBtn.addEventListener("click", () => {
  isPlaying = !isPlaying;
  playPauseBtn.textContent = isPlaying ? "暂停" : "开始滚动";
  if (isPlaying) {
    lastTs = 0;
    startAutoScroll();
    return;
  }

  if (rafId) {
    cancelAnimationFrame(rafId);
    rafId = null;
  }
});

speedRange.addEventListener("input", () => {
  const next = Number.parseInt(speedRange.value, 10);
  speed = clampSpeed(next);
  updateSpeedUI();
});

fontSizeRange.addEventListener("input", () => {
  const next = Number.parseInt(fontSizeRange.value, 10);
  fontSize = clampFontSize(next);
  updateFontSizeUI();
});

loopToggle.addEventListener("change", () => {
  isLooping = loopToggle.checked;
});

fullscreenBtn.addEventListener("click", async () => {
  if (document.fullscreenElement || isFallbackFullscreen) {
    await exitFullscreenView();
    return;
  }

  try {
    if (document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
      isFallbackFullscreen = false;
      reader.classList.add("reader-fullscreen");
      fullscreenBtn.textContent = "退出全屏";
    } else {
      isFallbackFullscreen = true;
      reader.classList.add("reader-fullscreen");
      fullscreenBtn.textContent = "退出全屏";
    }
  } catch {
    isFallbackFullscreen = !isFallbackFullscreen;
    reader.classList.toggle("reader-fullscreen");
    fullscreenBtn.textContent = reader.classList.contains("reader-fullscreen")
      ? "退出全屏"
      : "全屏阅读";
  }
});

exitFullscreenBtn.addEventListener("click", async () => {
  await exitFullscreenView();
});

document.addEventListener("fullscreenchange", () => {
  const inNativeFullscreen = Boolean(document.fullscreenElement);
  if (inNativeFullscreen) {
    reader.classList.add("reader-fullscreen");
    isFallbackFullscreen = false;
  } else if (!isFallbackFullscreen) {
    reader.classList.remove("reader-fullscreen");
  }
  const active = inNativeFullscreen || isFallbackFullscreen;
  fullscreenBtn.textContent = active ? "退出全屏" : "全屏阅读";
});

async function exitFullscreenView() {
  if (document.fullscreenElement) {
    await document.exitFullscreen();
  }
  isFallbackFullscreen = false;
  reader.classList.remove("reader-fullscreen");
  fullscreenBtn.textContent = "全屏阅读";
}

function enterReadingMode() {
  app.classList.add("reading-mode");
  syncToolbarOffset();
}

function leaveReadingMode() {
  app.classList.remove("reading-mode");
  syncToolbarOffset();
  if (isPlaying) {
    isPlaying = false;
    playPauseBtn.textContent = "开始滚动";
  }
}

function syncToolbarOffset() {
  document.documentElement.style.setProperty("--toolbar-offset", "8px");
}

function setFilterPanelOpen(shouldOpen) {
  roleFilterPanel.classList.toggle("hidden", !shouldOpen);
  filterToggle.setAttribute("aria-expanded", shouldOpen ? "true" : "false");
}

function setRoleSettingsPanelOpen(shouldOpen) {
  roleSettingsPanel.classList.toggle("hidden", !shouldOpen);
  roleSettingsToggle.setAttribute("aria-expanded", shouldOpen ? "true" : "false");
  roleSettingsSummary.textContent = shouldOpen ? "收起" : "展开";
}

function setToolbarPanelOpen(shouldOpen) {
  toolbarPanel.classList.toggle("hidden", !shouldOpen);
  toolbarToggle.setAttribute("aria-expanded", shouldOpen ? "true" : "false");
  toolbarSummary.textContent = shouldOpen ? "收起" : "展开";
  syncToolbarOffset();
}

function updateFilterSummary() {
  const selected = [...activeSpeakerFilters];
  if (!selected.length) {
    filterSummary.textContent = "全部角色";
    return;
  }

  filterSummary.textContent = selected.join("、");
}

scriptView.addEventListener("dblclick", (event) => {
  const speakerNode = event.target.closest(".speaker");
  if (speakerNode) {
    const targetSpeaker = speakerNode.dataset.speaker;
    if (!targetSpeaker) {
      return;
    }

    if (activeSpeakerFilters.has(targetSpeaker)) {
      activeSpeakerFilters.delete(targetSpeaker);
    } else {
      activeSpeakerFilters.add(targetSpeaker);
    }
    renderFromParsed();
    return;
  }

  const line = event.target.closest(".line[data-kind='dialogue']");
  if (!line) {
    return;
  }

  if (zoomedLine && zoomedLine !== line) {
    zoomedLine.classList.remove("zoomed");
  }

  line.classList.toggle("zoomed");
  zoomedLine = line.classList.contains("zoomed") ? line : null;
});

function updateSpeedUI() {
  speedValue.textContent = String(speed);
  speedRange.value = String(speed);
}

function updateFontSizeUI() {
  fontSizeValue.textContent = String(fontSize);
  fontSizeRange.value = String(fontSize);
  scriptView.style.setProperty("--line-font-size", `${fontSize}px`);
}

function clampSpeed(value) {
  return Math.min(SPEED_MAX, Math.max(SPEED_MIN, value));
}

function clampFontSize(value) {
  return Math.min(FONT_SIZE_MAX, Math.max(FONT_SIZE_MIN, value));
}

function startAutoScroll() {
  if (rafId) {
    cancelAnimationFrame(rafId);
  }
  lastTs = 0;

  const tick = (ts) => {
    if (!isPlaying) {
      rafId = null;
      return;
    }

    if (!lastTs) {
      lastTs = ts;
    }

    const dt = (ts - lastTs) / 1000;
    lastTs = ts;
    const delta = speed * dt;

    const maxTop = scriptView.scrollHeight - scriptView.clientHeight;
    if (maxTop > 0) {
      scriptView.scrollTop += delta;
      if (scriptView.scrollTop >= maxTop - 1) {
        if (isLooping) {
          scriptView.scrollTop = 0;
          rafId = requestAnimationFrame(tick);
          return;
        }
        scriptView.scrollTop = maxTop;
        isPlaying = false;
        playPauseBtn.textContent = "开始滚动";
        rafId = null;
        return;
      }
    }

    rafId = requestAnimationFrame(tick);
  };

  rafId = requestAnimationFrame(tick);
}

function parseScript(text) {
  const lines = String(text || "").split(/\r?\n/);
  const items = [];

  lines.forEach((rawLine) => {
    if (!rawLine || !rawLine.trim()) {
      return;
    }

    const matched = rawLine.match(/^\s*([^:：]{1,30})\s*[:：]\s*(.+)$/);
    if (matched) {
      items.push({
        speaker: matched[1].trim(),
        dialogue: matched[2].trim()
      });
      return;
    }

    // Lines starting with whitespace are treated as continuation of the previous speaker.
    if (/^\s+/.test(rawLine) && items.length > 0) {
      items[items.length - 1].dialogue += ` ${rawLine.trim()}`;
      return;
    }

    items.push({
      speaker: "旁白",
      dialogue: rawLine.trim()
    });
  });

  return items;
}

function normalizeBySpeaker(rawText) {
  return String(rawText || "")
    .split(/\r?\n/)
    .map((line) => normalizeSpeakerLine(line))
    .join("\n");
}

function getRenderText(rawText) {
  if (!isSmartParseEnabled) {
    return rawText;
  }
  return normalizeBySpeaker(rawText);
}

function normalizeSpeakerLine(line) {
  const source = String(line || "").trim();
  if (!source) {
    return line;
  }

  const colonMatched = source.match(/^([^:：]+)([:：])(.*)$/);
  if (colonMatched) {
    const leftText = colonMatched[1].trim();
    const rightRaw = String(colonMatched[3] || "");
    const speaker = extractSpeakerFromLeft(leftText);
    if (!speaker) {
      return line;
    }

    const leftRemainder = leftText
      .replace(speaker, "")
      .replace(/[，。！？、,.;；:：\s]+/g, "")
      .trim();

    // If left side has only the role name and no descriptive wording, keep original line.
    if (!leftRemainder) {
      return line;
    }

    const firstLine = `${speaker}：${toRoundBracket(leftText)}`;
    if (!rightRaw) {
      return firstLine;
    }
    return `${firstLine}\n${rightRaw}`;
  }

  const inferred = inferRoleAndDescription(source);
  if (!inferred) {
    return line;
  }

  if (!inferred.description) {
    return line;
  }

  return `${inferred.speaker}：${toRoundBracket(inferred.description)}`;
}

function extractSpeakerFromLeft(leftText) {
  const text = String(leftText || "").trim();
  if (!text) {
    return "";
  }

  const knownRoles = [
    "儿媳", "婆婆", "公公", "妈妈", "爸爸", "母亲", "父亲", "奶奶", "爷爷", "姐姐", "哥哥", "妹妹", "弟弟", "女儿", "儿子", "老公", "老婆", "丈夫", "妻子", "导演", "旁白"
  ];

  let hit = "";
  let hitIndex = Number.POSITIVE_INFINITY;

  knownRoles.forEach((role) => {
    const idx = text.indexOf(role);
    if (idx === -1) {
      return;
    }

    if (idx < hitIndex || (idx === hitIndex && role.length > hit.length)) {
      hit = role;
      hitIndex = idx;
    }
  });

  if (hit) {
    return hit;
  }

  const inferred = inferRoleAndDescription(text);
  return inferred ? inferred.speaker : "";
}

function inferRoleAndDescription(sentence) {
  const text = String(sentence || "").trim();
  if (!text) {
    return null;
  }

  const knownRoles = [
    "儿媳", "婆婆", "公公", "妈妈", "爸爸", "母亲", "父亲", "奶奶", "爷爷", "姐姐", "哥哥", "妹妹", "弟弟", "女儿", "儿子", "老公", "老婆", "丈夫", "妻子", "导演", "旁白"
  ];

  for (let i = 0; i < knownRoles.length; i += 1) {
    const role = knownRoles[i];
    if (text.startsWith(role)) {
      const rest = text
        .slice(role.length)
        .trim()
        .replace(/^[，。！？、,.;；:：\s]+/, "");
      return {
        speaker: role,
        description: rest
      };
    }
  }

  const actionWords = [
    "回答", "回道", "说道", "说", "问", "笑", "哭", "喊", "叫", "看着", "看向", "沉默", "点头", "摇头", "叹气", "走", "跑", "坐", "站", "拿", "递", "拍", "望着"
  ];

  let splitIndex = -1;
  actionWords.forEach((word) => {
    const idx = text.indexOf(word);
    if (idx > 0 && idx <= 8 && (splitIndex === -1 || idx < splitIndex)) {
      splitIndex = idx;
    }
  });

  if (splitIndex > 0) {
    const speaker = text.slice(0, splitIndex).trim().replace(/[，。！？、,.;；:：\s]+$/g, "");
    const content = text.slice(splitIndex).trim();

    if (speaker) {
      return {
        speaker,
        description: content
      };
    }
  }

  return {
    speaker: text,
    description: ""
  };
}

function toRoundBracket(content) {
  const clean = String(content || "").trim();
  if (!clean) {
    return "（）";
  }
  if (/^（.*）$/.test(clean)) {
    return clean;
  }
  return `（${clean.replace(/^（|）$/g, "")}）`;
}

function hashToHue(text) {
  let hash = 0;
  for (let i = 0; i < text.length; i += 1) {
    hash = (hash << 5) - hash + text.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash) % 360;
}

function colorForSpeaker(speaker) {
  if (speakerColors.has(speaker)) {
    return speakerColors.get(speaker);
  }

  const hue = hashToHue(speaker);
  const generated = `hsl(${hue} 72% 42%)`;
  speakerColors.set(speaker, generated);
  return generated;
}

function hslToHex(hslString) {
  const match = hslString.match(/hsl\((\d+)\s+(\d+)%\s+(\d+)%\)/);
  if (!match) {
    return "#334155";
  }

  const h = Number.parseInt(match[1], 10) / 360;
  const s = Number.parseInt(match[2], 10) / 100;
  const l = Number.parseInt(match[3], 10) / 100;

  const hue2rgb = (p, q, t) => {
    let v = t;
    if (v < 0) {
      v += 1;
    }
    if (v > 1) {
      v -= 1;
    }
    if (v < 1 / 6) {
      return p + (q - p) * 6 * v;
    }
    if (v < 1 / 2) {
      return q;
    }
    if (v < 2 / 3) {
      return p + (q - p) * (2 / 3 - v) * 6;
    }
    return p;
  };

  let r;
  let g;
  let b;

  if (s === 0) {
    r = l;
    g = l;
    b = l;
  } else {
    const q = l < 0.5 ? l * (1 + s) : l + s - l * s;
    const p = 2 * l - q;
    r = hue2rgb(p, q, h + 1 / 3);
    g = hue2rgb(p, q, h);
    b = hue2rgb(p, q, h - 1 / 3);
  }

  const toHex = (value) => {
    const hex = Math.round(value * 255).toString(16).padStart(2, "0");
    return hex;
  };

  return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
}

function normalizeHexColor(color) {
  const hex = color.trim().toLowerCase();
  if (/^#[0-9a-f]{6}$/.test(hex)) {
    return hex;
  }
  if (/^#[0-9a-f]{3}$/.test(hex)) {
    return `#${hex[1]}${hex[1]}${hex[2]}${hex[2]}${hex[3]}${hex[3]}`;
  }
  return "#334155";
}

function renderRoleFilterBar() {
  roleFilterBar.innerHTML = "";
  const speakers = [...new Set(parsedScript.map((item) => item.speaker))];
  const hasFilter = activeSpeakerFilters.size > 0;

  const allChip = document.createElement("button");
  allChip.type = "button";
  allChip.className = "filter-chip";
  allChip.textContent = "全部";
  if (!hasFilter) {
    allChip.classList.add("active");
    allChip.style.background = "#0f172a";
  }
  allChip.addEventListener("click", () => {
    activeSpeakerFilters.clear();
    renderFromParsed();
  });
  roleFilterBar.appendChild(allChip);

  speakers.forEach((speaker) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "filter-chip";
    chip.textContent = speaker;

    const color = colorForSpeaker(speaker);
    chip.style.borderColor = color;
    chip.style.color = color;

    if (activeSpeakerFilters.has(speaker)) {
      chip.classList.add("active");
      chip.style.background = color;
      chip.style.color = "#ffffff";
    }

    chip.addEventListener("click", () => {
      if (activeSpeakerFilters.has(speaker)) {
        activeSpeakerFilters.delete(speaker);
      } else {
        activeSpeakerFilters.add(speaker);
      }
      renderFromParsed();
    });

    roleFilterBar.appendChild(chip);
  });
}

function renderRoleSettings() {
  roleSettings.innerHTML = "";
  const speakers = [...new Set(parsedScript.map((item) => item.speaker))];

  if (!speakers.length) {
    return;
  }

  const fragment = document.createDocumentFragment();

  speakers.forEach((speaker) => {
    const card = document.createElement("div");
    card.className = "role-card";

    const roleLabel = document.createElement("span");
    roleLabel.className = "role-label";
    roleLabel.textContent = speaker;
    roleLabel.style.color = colorForSpeaker(speaker);

    const colorInput = document.createElement("input");
    colorInput.type = "color";
    colorInput.className = "role-color";
    colorInput.value = normalizeHexColor(hslToHex(colorForSpeaker(speaker)));
    colorInput.setAttribute("aria-label", `${speaker} 颜色设置`);
    colorInput.addEventListener("input", () => {
      speakerColors.set(speaker, colorInput.value);
      renderFromParsed();
    });

    card.appendChild(roleLabel);
    card.appendChild(colorInput);
    fragment.appendChild(card);
  });

  roleSettings.appendChild(fragment);
}

function renderFromParsed() {
  scriptView.innerHTML = "";
  scriptView.scrollTop = 0;
  zoomedLine = null;

  const hasFilter = activeSpeakerFilters.size > 0;
  const viewItems = hasFilter
    ? parsedScript.filter((item) => activeSpeakerFilters.has(item.speaker))
    : parsedScript;

  if (!viewItems.length) {
    const empty = document.createElement("p");
    empty.className = "line";
    empty.dataset.kind = "hint";
    empty.textContent = "当前筛选下没有台词。";
    scriptView.appendChild(empty);
    renderRoleFilterBar();
    renderRoleSettings();
    return;
  }

  const fragment = document.createDocumentFragment();

  viewItems.forEach((item) => {
    const row = document.createElement("p");
    row.className = "line";
    row.dataset.kind = "dialogue";

    const speaker = document.createElement("span");
    speaker.className = "speaker";
    speaker.dataset.speaker = item.speaker;
    speaker.textContent = `${item.speaker}：`;

    const dialogue = document.createElement("span");
    dialogue.className = "dialogue";
    dialogue.textContent = item.dialogue;

    const color = colorForSpeaker(item.speaker);
    row.style.setProperty("--speaker-color", color);
    speaker.style.color = color;
    dialogue.style.color = color;

    row.appendChild(speaker);
    row.appendChild(dialogue);
    fragment.appendChild(row);
  });

  scriptView.appendChild(fragment);
  renderRoleFilterBar();
  renderRoleSettings();
  updateFilterSummary();
}

function renderScript(rawText) {
  const text = (rawText || "").trim();
  parsedScript = [];
  activeSpeakerFilters.clear();

  if (!text) {
    roleSettings.innerHTML = "";
    roleFilterBar.innerHTML = "";
    scriptView.innerHTML = "";
    const empty = document.createElement("p");
    empty.className = "line";
    empty.dataset.kind = "hint";
    empty.textContent = "请先在上方输入剧本，然后点击“加载剧本”。";
    scriptView.appendChild(empty);
    updateFilterSummary();
    return;
  }

  parsedScript = parseScript(text);
  renderFromParsed();
}

syncToolbarOffset();
updateSpeedUI();
updateFontSizeUI();
setRoleSettingsPanelOpen(false);
setFilterPanelOpen(false);
setToolbarPanelOpen(false);
sampleBtn.classList.remove("smart-active");
renderScript("");
  </script>
